# NetCmd SaaS services. This Blueprint is isolated from the existing
# netcmd-site static service. Sync this Blueprint only after reviewing plans.
services:
  - type: web
    name: netcmd-cloud-api
    runtime: docker
    region: frankfurt
    plan: 0.5c-512mb
    branch: feature/netcmd-saas-foundation
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: ./services/api
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: NETCMD_API_KEY_PEPPER
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://netcmd-site.onrender.com

  - type: worker
    name: netcmd-cloud-worker
    runtime: python
    region: frankfurt
    plan: 0.5c-512mb
    branch: feature/netcmd-saas-foundation
    rootDir: services/worker
    buildCommand: pip install -r requirements.txt
    startCommand: python worker.py
    maxShutdownDelaySeconds: 120
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: POLL_SECONDS
        value: "5"

name: Validate NetCmd

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - feature/netcmd-2.0
      - feature/global-monetization-paddle
      - feature/bmc-membership-premium

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build static site
        env:
          BASE_URL: https://netcmd-site.onrender.com
        run: |
          python3 -m py_compile build.py
          python3 build.py
          test -s dist/sitemap.xml
          test -s dist/robots.txt
          test -s dist/tr/index.html
          test -s dist/en/index.html
          test -s dist/ar/index.html

      - name: Validate JavaScript syntax
        run: |
          find assets -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check

      - name: Set up Deno for Edge Function validation
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check NetCmd Edge Function
        run: deno check supabase/functions/netcmd-jobs/index.ts

      - name: Run network logic tests
        run: node --test tests/*.test.cjs

      - name: Test SaaS API foundation
        run: |
          python3 -m pip install -r services/api/requirements.txt
          cd services/api
          python3 -m unittest discover -s . -p "test_*.py" -v

      - name: Validate generated sitemap XML
        run: python3 -c "import xml.etree.ElementTree as ET; ET.parse('dist/sitemap.xml')"

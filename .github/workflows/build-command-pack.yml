name: Build NetCmd command pack

on:
  workflow_dispatch:
  push:
    paths:
      - "products/network-command-pack/**"
      - "scripts/build_command_pack.py"
      - ".github/workflows/build-command-pack.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF dependency
        run: python -m pip install --upgrade pip reportlab
      - name: Generate PDFs and ZIP
        run: python scripts/build_command_pack.py
      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: NetCmd-Network-Command-Pack-v1
          path: dist/network-command-pack/*
          if-no-files-found: error
          retention-days: 30

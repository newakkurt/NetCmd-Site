name: NetCmd Free Queue Worker

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netcmd-free-queue-worker
  cancel-in-progress: false

jobs:
  process-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NETCMD_WORKER_ONCE: "1"
      NETCMD_MAX_JOBS_PER_RUN: "20"
    steps:
      - name: Check required secrets
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::notice::Set SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY repository Actions secrets to enable queue processing."
            exit 0
          fi
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/worker/requirements.txt
      - name: Install worker dependencies
        run: python -m pip install -r services/worker/requirements.txt
      - name: Process queued jobs
        run: python services/worker/worker.py
